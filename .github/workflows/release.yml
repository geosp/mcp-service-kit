name: Release

# Push a tag like v0.2.0 (or v0.2.0-rc1 for a prerelease) on main to publish a GitHub Release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  build:
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # needed for tags and the main-branch check
      - uses: astral-sh/setup-uv@v10

      - name: Check the tag is on main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag $GITHUB_REF_NAME points to a commit that is not on main"
            exit 1
          fi

      - run: uv build

      - name: Check the package version matches the tag
        run: |
          expected="${GITHUB_REF_NAME#v}"
          wheel=$(ls dist/*.whl)
          actual=$(basename "$wheel" | cut -d- -f2)
          # Wheel filenames use the normalized version (e.g. 0.2.0-rc1 -> 0.2.0rc1)
          normalized=$(uvx --from packaging python -c "from packaging.version import Version; print(Version('$expected'))")
          if [ "$actual" != "$normalized" ]; then
            echo "::error::Wheel version $actual does not match tag $GITHUB_REF_NAME"
            exit 1
          fi
          echo "Building release $actual"

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  github-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            prerelease="--prerelease"
          fi
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag \
            $prerelease
