[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "mcp-service-kit"
dynamic = ["version"]
description = "A small library for building FastMCP servers with stdio and HTTP transports, a standard CLI and env-based config."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=4.1.3",
    "pydantic>=2.14",
    "pydantic-settings>=2.16",
    "python-dotenv>=1.2",
]

[project.urls]
Homepage = "https://github.com/geosp/mcp-service-kit"
Repository = "https://github.com/geosp/mcp-service-kit"
Issues = "https://github.com/geosp/mcp-service-kit/issues"

[project.optional-dependencies]
redis = [
    "py-key-value-aio[redis]>=0.4.6",
]
dev = [
    "pytest>=9.1",
    "pytest-asyncio>=1.4",
    "ruff>=0.17",
]

[tool.hatch.version]
# The version comes from the git tag (v0.1.0 -> 0.1.0); untagged commits get a .devN version.
source = "vcs"

[tool.hatch.version.raw-options]
# Only used for builds without git metadata
fallback_version = "0.0.0"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_service_kit"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = [
    # py-key-value's RedisStore still calls setex, deprecated in redis-py 8 (upstream issue)
    "ignore:Call to deprecated setex:DeprecationWarning",
]

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
